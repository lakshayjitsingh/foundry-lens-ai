services:
  - type: web
    name: foundry-lens-ai
    runtime: python
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEFAULT_FOUNDRY_MODEL
        value: gpt-4o-mini
      - key: AZURE_FOUNDRY_ENDPOINT
        sync: false
      - key: AZURE_FOUNDRY_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
